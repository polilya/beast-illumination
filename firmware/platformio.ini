; Beast illumination firmware.
;   pio run -e esp32            build the ESP32 firmware
;   pio run -e esp32 -t upload  flash it
;   pio test -e native          run the effect-engine unit tests on the host

[platformio]
default_envs = esp32

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@3.10.3
monitor_speed = 115200
build_flags = ${env.build_flags} -Wall

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -Wall -Wextra
